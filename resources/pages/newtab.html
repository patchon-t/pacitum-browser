<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<meta name="color-scheme" content="light dark">
<style>
@font-face{font-family:Rubik;src:url(pacitum://fonts/Rubik-VF.ttf) format("truetype");font-weight:300 900}
:root{--page:%PAGE%;--card:%TOOL%;--text:%TXT%;--sec:%SEC%;--ter:%TER%;--border:%BORD%;--border2:%BORD2%;--field:%FIELD%;--surface:%SURF%;--surfh:%SURFH%;
--accent:%ACC%;--onacc:%ONACC%;--primary:%PRIMARY%;--onprimary:%ONPRIMARY%;--chip:color-mix(in srgb,var(--text) 7%,var(--page));--chipink:color-mix(in srgb,var(--text) 85%,var(--page))}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:14px Rubik,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.photo{background:var(--page) center/cover no-repeat fixed}
body.photo::before{content:"";position:fixed;inset:0;background:color-mix(in srgb,var(--page) 55%,transparent);pointer-events:none}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--primary);color:var(--onprimary)}
input{caret-color:var(--accent)}
input::placeholder{color:var(--sec);opacity:1}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:72px 24px 28px}
.col{width:min(1100px,100%);display:flex;flex-direction:column;flex:1}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.wm{height:52px;width:auto;color:var(--text);flex:none}
.wm.small{height:40px}
#clock{font-size:13px;color:var(--sec)}
.search{margin-top:30px;height:60px;display:flex;align-items:center;gap:14px;padding:0 10px 0 20px;background:var(--card);border:1px solid var(--border);border-radius:18px;transition:box-shadow .15s,border-color .15s}
.search:focus-within{border-color:var(--border2);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 8%,transparent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px}
.eng{height:40px;padding:0 14px 0 16px;border:0;border-radius:12px;background:var(--field);font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex:none}
.eng:hover{background:var(--surfh)}
.grid{margin-top:48px;display:grid;grid-template-columns:640px 1fr;column-gap:56px;align-items:start}
.grid.one{grid-template-columns:1fr}
.sh{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border)}
h2{margin:0;font-size:15px;font-weight:600}
.meta{font-size:12.5px;color:var(--sec)}
.sites{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.row{display:flex;align-items:center;gap:12px;height:58px;padding:0 8px;margin:0 -8px;border-radius:12px;transition:background .15s}
.row:hover{background:var(--surface)}
.tile{width:34px;height:34px;border-radius:10px;background:var(--chip);color:var(--chipink);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.tile.ink{background:var(--primary);color:var(--onprimary)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tx b{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx span{font-size:12.5px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n{font-size:13px;color:var(--sec)}
.left{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:8px 8px 6px}
.lh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 10px 14px}
.ink{height:36px;padding:0 16px;border:0;border-radius:12px;background:var(--primary);color:var(--onprimary);font-size:13.5px;font-weight:500;flex:none}
.ink:hover{filter:brightness(1.15)}
.lrow{display:flex;align-items:center;gap:12px;height:52px;padding:0 12px;border-radius:12px;transition:background .15s}
.lrow:hover{background:var(--surface)}
.lrow .tile{width:26px;height:26px;border-radius:8px;font-size:12px}
.lrow b{flex:1;min-width:0;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow span{font-size:12.5px;color:var(--sec);flex:none}
.asleep{display:flex;align-items:center;gap:8px;margin:6px 6px 0;padding:12px 12px 8px;border-top:1px solid var(--border);font-size:12.5px;color:var(--sec)}
.empty{padding:18px 14px 20px;font-size:13.5px;color:var(--sec);line-height:1.5}
.foot{margin-top:auto;padding-top:40px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.fl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sec);border:0;background:transparent;padding:6px 8px;border-radius:10px}
.fl:hover{background:var(--surface);color:var(--text)}
.menu{position:absolute;z-index:20;min-width:200px;padding:6px;background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--border),0 12px 32px rgba(0,0,0,.16);animation:pop .12s ease-out}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 12px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:14px}
.menu button:hover,.menu button:focus{background:var(--surface);outline:0}
.menu button.on{font-weight:600}
.menu button.on::after{content:"";margin-left:auto;width:8px;height:8px;border-radius:3px;background:var(--accent)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sheet{position:fixed;right:24px;bottom:72px;z-index:30;width:340px;padding:18px;background:var(--card);border-radius:20px;box-shadow:0 0 0 1px var(--border),0 18px 48px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px;animation:pop .14s ease-out}
.sheet h3{margin:0 0 4px;font-size:16px;font-weight:600}
.lab{font-size:12.5px;font-weight:600;color:var(--sec);margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--field);border-radius:13px}
.seg button{height:32px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:500}
.seg button[aria-checked=true]{background:var(--card);box-shadow:0 0 0 1px var(--border);font-weight:600}
.tg{display:flex;align-items:center;gap:12px;min-height:40px;border:0;background:transparent;padding:0;text-align:left;width:100%;font-size:14px}
.tg span{flex:1}
.sw{width:40px;height:24px;border-radius:12px;background:var(--border2);display:flex;align-items:center;padding:3px;flex:none;transition:background .15s}
.sw i{width:18px;height:18px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.tg[aria-checked=true] .sw{background:var(--primary)}
.tg[aria-checked=true] .sw i{transform:translateX(16px)}
.btn{height:36px;padding:0 14px;border:0;border-radius:11px;background:var(--field);font-size:13.5px;font-weight:600}
.btn:hover{background:var(--surfh)}
.rm *{animation:none!important;transition:none!important}
@media (max-width:980px){.grid{grid-template-columns:1fr;row-gap:32px}.wrap{padding-top:48px}}
@media (max-width:560px){.sites{grid-template-columns:1fr}.wm{height:40px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="col">
  <div class="head">
   <svg class="wm" viewBox="395 710 3634 560" role="img" aria-label="Pacitum">%WORDMARK%</svg>
   <span id="clock" class="num"></span>
  </div>
  <form class="search" id="sf" role="search">
   <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
   <input id="q" autocomplete="off" spellcheck="false" aria-label="Search or type a web address" autofocus>
   <button type="button" class="eng" id="eng" aria-haspopup="menu"></button>
  </form>
  <div class="grid" id="grid">
   <section id="ts" aria-labelledby="tsh">
    <div class="sh"><h2 id="tsh">Top sites</h2><span class="meta">visits</span></div>
    <div class="sites" id="sites"></div>
   </section>
   <section class="left" id="ls" aria-labelledby="lsh"></section>
  </div>
  <div class="foot">
   <button class="fl" id="blocked" type="button"></button>
   <button class="fl" id="cz" type="button" aria-haspopup="dialog"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 4v6M8 14v6"/></svg>Customise</button>
  </div>
 </div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<script>
'use strict';
var D = %DATA%;
var $ = function (s) { return document.querySelector(s); };
var KEY = 'pacitum.home.v2';
var S; try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
function dflt(k, v) { if (S[k] === undefined) S[k] = v; }
dflt('top', true); dflt('left', true); dflt('clock', true); dflt('hidden', []); dflt('bg', 'plain');
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
if (D.reduced || matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('rm');
function act(name, args) {
  var q = Object.keys(args || {}).map(function (k) { return k + '=' + encodeURIComponent(args[k]); }).join('&');
  return fetch('pacitum://action/' + name + (q ? '?' + q : '')).catch(function () {});
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }
function nice(u, t) {
  var h = host(u), known = { 'github.com': 'GitHub', 'youtube.com': 'YouTube', 'mail.google.com': 'Mail', 'doc.qt.io': 'Qt Documentation', 'stackoverflow.com': 'Stack Overflow',
    'wikipedia.org': 'Wikipedia', 'en.wikipedia.org': 'Wikipedia', 'claude.ai': 'Claude', 'google.com': 'Google', 'x.com': 'X', 'facebook.com': 'Facebook', 'reddit.com': 'Reddit' };
  if (known[h]) return known[h];
  if (t && t.length <= 28) return t;
  var b = h.split('.'); var core = b.length > 1 ? b[b.length - 2] : h;
  return core.charAt(0).toUpperCase() + core.slice(1);
}
function letter(s) { return esc((s || '?').trim().charAt(0).toUpperCase()); }
function go(v) {
  v = (v || '').trim(); if (!v) return;
  var url = /^[a-z][a-z0-9+.-]*:/i.test(v) && !/^[a-z]+:\d/i.test(v) ? v : (v.indexOf('.') > 0 && v.indexOf(' ') < 0 ? 'https://' + v : (D.engines[D.engine] || D.search) + encodeURIComponent(v));
  location.href = url;
}

// header
function tick() {
  var d = new Date();
  $('#clock').textContent = S.clock ? d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
}
tick(); setInterval(tick, 15000);

// search + engine
function engine() {
  $('#eng').innerHTML = esc(D.engine) + ' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  $('#q').placeholder = 'Search ' + D.engine + ' or type a web address';
}
engine();
$('#sf').onsubmit = function (e) { e.preventDefault(); go($('#q').value); };
function closeMenus() { document.querySelectorAll('.menu,.sheet').forEach(function (m) { m.remove(); }); }
function menu(anchor, items, alignRight) {
  closeMenus();
  var m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  items.forEach(function (it) {
    var b = document.createElement('button'); b.setAttribute('role', 'menuitem'); b.textContent = it[0]; if (it[2]) b.className = 'on';
    b.onclick = function () { closeMenus(); it[1](); }; m.appendChild(b);
  });
  document.body.appendChild(m);
  var r = anchor.getBoundingClientRect();
  m.style.top = (r.bottom + 6 + scrollY) + 'px';
  m.style.left = (alignRight ? r.right - m.offsetWidth : r.left) + scrollX + 'px';
  m.querySelector('button').focus();
}
$('#eng').onclick = function (e) {
  e.stopPropagation();
  menu(this, Object.keys(D.engines).map(function (k) { return [k, function () { D.engine = k; engine(); act('engine', { v: k }); $('#q').focus(); }, k === D.engine]; }), true);
};
document.addEventListener('click', function (e) { if (!e.target.closest('.menu,.sheet,#eng,#cz')) closeMenus(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenus(); });

// top sites
function sites() {
  var list = (D.sites || []).filter(function (s) { return S.hidden.indexOf(host(s.u)) < 0; }).slice(0, 8);
  $('#ts').style.display = S.top ? '' : 'none';
  $('#sites').innerHTML = list.length ? list.map(function (s, i) {
    var name = nice(s.u, s.t);
    return '<a class="row" href="' + esc(s.u) + '" data-h="' + esc(host(s.u)) + '" title="' + esc(s.t || s.u) + '"><span class="tile' + (i === 0 ? ' ink' : '') + '">' + letter(name) + '</span>' +
      '<span class="tx"><b>' + esc(name) + '</b><span>' + esc(host(s.u)) + '</span></span><span class="n num">' + (s.n || '') + '</span></a>';
  }).join('') : '<div class="empty" style="grid-column:1/-1">Sites you visit often appear here.</div>';
  document.querySelectorAll('#sites .row').forEach(function (a) {
    a.oncontextmenu = function (e) {
      e.preventDefault();
      var h = a.dataset.h, u = a.href;
      menu(a, [['Open in new tab', function () { act('open', { url: u }); }], ['Remove from top sites', function () { S.hidden.push(h); save(); sites(); }]]);
    };
  });
}

// where you left off
function left() {
  var L = D.left || { tabs: [] }, tabs = L.tabs || [];
  var el = $('#ls');
  el.style.display = S.left ? '' : 'none';
  var when = L.at ? new Date(L.at * 1000) : null;
  var sub = tabs.length ? (tabs.length + (tabs.length === 1 ? ' tab' : ' tabs') + (when ? ' · closed ' + (when.toDateString() === new Date().toDateString() ? when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : when.toLocaleDateString()) : '')) : (L.label || '');
  var html = '<div class="lh"><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><h2 id="lsh">Where you left off</h2><span class="meta num">' + esc(sub) + '</span></div>' +
    (tabs.length ? '<button class="ink" id="restore">Restore all</button>' : '') + '</div>';
  html += tabs.length ? tabs.slice(0, 5).map(function (t) {
    var name = t.t || host(t.u);
    return '<a class="lrow" href="' + esc(t.u) + '"><span class="tile">' + letter(host(t.u)) + '</span><b>' + esc(name) + '</b><span>' + esc(host(t.u)) + '</span></a>';
  }).join('') : '<div class="empty">Tabs you close show up here, so you can pick up where you left off.</div>';
  if (D.asleep > 0) html += '<div class="asleep"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>' +
    D.asleep + (D.asleep === 1 ? ' tab is asleep' : ' tabs are asleep') + ' to save memory</div>';
  el.innerHTML = html;
  var r = $('#restore'); if (r) r.onclick = function () { act('restore'); D.left = { tabs: [] }; left(); };
  $('#grid').classList.toggle('one', !S.top || !S.left);
}

// footer
function footer() {
  var b = $('#blocked');
  var shield = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l7 3v5c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9v-5z"/></svg>';
  b.innerHTML = shield + (D.adblock ? (D.blocked === 1 ? '1 tracker blocked today' : (D.blocked || 0) + ' trackers blocked today') : 'Tracker blocking is off');
  b.onclick = function () { act('privacy'); };
}

// customise
function bg() {
  document.body.classList.toggle('photo', S.bg === 'photo' && !!S.photo);
  document.body.style.backgroundImage = S.bg === 'photo' && S.photo ? 'url(' + S.photo + ')' : '';
}
$('#cz').onclick = function (e) {
  e.stopPropagation();
  if (document.querySelector('.sheet')) { closeMenus(); return; }
  closeMenus();
  var t = D.theme || 'System';
  var p = document.createElement('div'); p.className = 'sheet'; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Customise');
  var tg = function (k, label) { return '<button class="tg" role="switch" aria-checked="' + !!S[k] + '" data-k="' + k + '"><span>' + label + '</span><span class="sw"><i></i></span></button>'; };
  p.innerHTML = '<h3>Customise</h3><span class="lab">Theme</span><div class="seg" role="radiogroup">' + ['System', 'Light', 'Dark'].map(function (x) {
      return '<button role="radio" aria-checked="' + (t === x) + '" data-t="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
    '<span class="lab">Show</span>' + tg('top', 'Top sites') + tg('left', 'Where you left off') + tg('clock', 'Date and time') +
    '<span class="lab">Background</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-bg="plain">Plain</button><button class="btn" data-bg="photo">' + (S.photo ? 'Change photo' : 'Photo…') + '</button>' +
    (S.photo ? '<button class="btn" data-bg="remove">Remove photo</button>' : '') + '</div>' +
    '<button class="btn" style="margin-top:8px" data-more="1">More themes and colours…</button>';
  document.body.appendChild(p);
  p.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { D.theme = b.dataset.t; act('theme', { v: b.dataset.t }); p.querySelectorAll('[data-t]').forEach(function (x) { x.setAttribute('aria-checked', x === b); }); }; });
  p.querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { S[b.dataset.k] = !S[b.dataset.k]; save(); b.setAttribute('aria-checked', !!S[b.dataset.k]); render(); }; });
  p.querySelectorAll('[data-bg]').forEach(function (b) { b.onclick = function () {
    var v = b.dataset.bg;
    if (v === 'photo') { $('#file').click(); return; }
    if (v === 'remove') { delete S.photo; S.bg = 'plain'; } else S.bg = v;
    save(); bg(); closeMenus();
  }; });
  p.querySelector('[data-more]').onclick = function () { act('customise'); closeMenus(); };
};
$('#file').onchange = function () {
  var f = this.files && this.files[0]; if (!f) return;
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var w = Math.min(2400, img.width), h = Math.round(img.height * w / img.width), c = document.createElement('canvas');
    c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
    try { S.photo = c.toDataURL('image/jpeg', 0.86); S.bg = 'photo'; save(); } catch (e) {}
    URL.revokeObjectURL(url); bg(); closeMenus();
  };
  img.src = url; this.value = '';
};

function render() { tick(); sites(); left(); footer(); bg(); }
render();
</script>
</body>
</html>
