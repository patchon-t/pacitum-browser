name: Build Linux
# Linux AppImage, .deb and .rpm. (2.0.4: the macOS build was removed.)
# Runs for pull requests that touch the app, for version tags, and on demand (Actions → Run workflow).
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['src/**', 'include/**', 'resources/**', 'third_party/**', 'CMakeLists.txt', '.github/workflows/linux.yml', 'packaging/**']
permissions:
  contents: write   # tag builds attach the AppImage / .deb / .rpm + .sha256 to an existing release (updater feed)
jobs:
  linux:
    runs-on: ubuntu-22.04   # older glibc = the AppImage runs on more distributions
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: main,   qt: '6.11.*' }
    name: linux (${{ matrix.line }}, Qt ${{ matrix.qt }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtwebengine qtwebchannel qtpositioning qtserialport qtconnectivity'
          cache: true
      - name: Qt WebEngine with H.264 / AAC (when built)
        # YouTube live, Twitch and MP4 video (issue #52). Published by qtwebengine-codecs.yml for this exact Qt version.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$("$QT_ROOT_DIR/bin/qmake" -query QT_VERSION | tr -d '\r')
          tag="qtwebengine-$ver-codecs"
          if [ "$RUNNER_OS" = Windows ]; then asset="$tag-windows.7z"; else asset="$tag-linux.tar.xz"; fi
          if gh release download "$tag" -R "$GITHUB_REPOSITORY" -p "$asset" -D "$RUNNER_TEMP" 2>/dev/null; then
            if [ "$RUNNER_OS" = Windows ]; then 7z x -y -o"$QT_ROOT_DIR" "$RUNNER_TEMP/$asset" >/dev/null; else tar --force-local -xJf "$RUNNER_TEMP/$asset" -C "$QT_ROOT_DIR"; fi
            echo "Qt WebEngine $ver with proprietary codecs"
          else
            echo "::warning::No codecs build for Qt $ver yet: H.264 / AAC (YouTube live, Twitch) won't play. Run 'Qt WebEngine with codecs'."
          fi
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2 xvfb libfuse2 file
      - name: Build
        env:   # Google sync OAuth client (repo secrets; empty = users paste their own in Settings)
          GOOGLE_ID: ${{ secrets.PACITUM_GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.PACITUM_GOOGLE_CLIENT_SECRET }}
          CRASH_WEBHOOK: ${{ secrets.PACITUM_CRASH_WEBHOOK }}   # 2.0.5 crash reports (empty = off)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr "-DPACITUM_GOOGLE_CLIENT_ID=$GOOGLE_ID" "-DPACITUM_GOOGLE_CLIENT_SECRET=$GOOGLE_SECRET" "-DPACITUM_CRASH_WEBHOOK=$CRASH_WEBHOOK"
          cmake --build build
      - name: Smoke test (window opens and stays up)
        env:
          QTWEBENGINE_DISABLE_SANDBOX: '1'   # CI containers block Chromium's sandbox; real installs keep it
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" ./build/PacitumBrowser --smoke-test || echo "exit code $?"
          log="$HOME/.local/share/Pacitum/Pacitum Browser/startup.log"
          tail -n 40 "$log" || true
          grep -q "SMOKE OK" "$log"
      - name: Showcase screenshots
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends xdotool imagemagick jq
          bash .github/showcase.sh ./build/PacitumBrowser
      - uses: actions/upload-artifact@v7.0.2
        continue-on-error: true
        with:
          name: Pacitum-showcase
          path: showcase/*.jpg
          retention-days: 7
      - name: AppImage
        run: |
          ver=$(cat build/pacitum-version.txt)   # 1.9.x (Qt 6.11) or 1.8.x (legacy, Qt 6.8)
          DESTDIR="$PWD/AppDir" cmake --install build
          # SQL drivers we don't ship pull in client libraries the AppImage tool can't find
          find "$QT_ROOT_DIR/plugins/sqldrivers" -name '*.so' ! -name 'libqsqlite.so' -delete
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Wayland platform plugins: Qt 6.8 ships libqwayland-egl / -generic, Qt 6.11 renamed them
          # (one libqwayland.so). Bundle whichever exist so both editions run on Wayland desktops.
          plugins=""
          for p in libqwayland-egl.so libqwayland-generic.so libqwayland.so; do
            [ -f "$QT_ROOT_DIR/plugins/platforms/$p" ] && plugins="${plugins:+$plugins;}$p"
          done
          ls "$QT_ROOT_DIR/plugins/platforms/"
          echo "extra platform plugins: ${plugins:-none}"
          [ -n "$plugins" ] && export EXTRA_PLATFORM_PLUGINS="$plugins"
          export OUTPUT="PacitumBrowser-$ver-linux-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e AppDir/usr/bin/PacitumBrowser \
            -d resources/linux/pacitum-browser.desktop -i resources/linux/pacitum-browser.png --plugin qt --output appimage
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          ls -la "$OUTPUT"
      - name: Packages (.deb + .rpm)
        run: |
          ver=$(cat build/pacitum-version.txt)
          sudo apt-get install -y --no-install-recommends ruby rpm
          sudo gem install --no-document fpm -v 1.16.0
          bash packaging/linux/build-packages.sh "$ver" "$PWD/AppDir" "$PWD"
          echo "--- deb"; dpkg-deb -I PacitumBrowser-$ver-linux-x86_64.deb | head -30
          echo "--- rpm requires"; rpm -qp --requires PacitumBrowser-$ver-linux-x86_64.rpm
      - name: Install the .deb and check that it starts
        # 2.0.9-A: with Chromium's sandbox on, through /usr/bin/pacitum-browser (the launcher), as a user would start it.
        # (This step used to turn the sandbox off, so a sandbox failure could never show up here.)
        run: |
          ver=$(cat build/pacitum-version.txt)
          rm -rf "$HOME/.local/share/Pacitum"
          sudo apt-get install -y --no-install-recommends ./PacitumBrowser-$ver-linux-x86_64.deb
          test -x /usr/bin/pacitum-browser && test -f /usr/share/applications/pacitum-browser.desktop
          xvfb-run -a -s "-screen 0 1440x900x24" /usr/bin/pacitum-browser --smoke-test || echo "exit code $?"
          log="$HOME/.local/share/Pacitum/Pacitum Browser/startup.log"
          tail -n 40 "$log" || true
          grep -q "SMOKE OK" "$log"
          echo "--- launch.log"; cat "$HOME/.local/share/Pacitum/Pacitum Browser/launch.log" | grep -E "^===|^exit|^retrying" || true
          if grep -q "^retrying" "$HOME/.local/share/Pacitum/Pacitum Browser/launch.log"; then echo "::warning::the browser only started in safe mode"; fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PacitumBrowser-Linux-${{ matrix.line }}
          path: |
            PacitumBrowser-*.AppImage*
            PacitumBrowser-*.deb*
            PacitumBrowser-*.rpm*
          retention-days: 3
      - name: Attach to the release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          [ "${{ github.ref_name }}" = "v$(cat build/pacitum-version.txt)" ] || { echo "tag is for the other line; skipping"; exit 0; }
          bash .github/ensure-release.sh "${{ github.ref_name }}" "${{ github.repository }}" || { echo "no release and no release-notes/${{ github.ref_name }}.md; skipping"; exit 0; }
          gh release upload "${{ github.ref_name }}" PacitumBrowser-*.AppImage* PacitumBrowser-*.deb* PacitumBrowser-*.rpm* --clobber --repo "${{ github.repository }}"

  # 2.0.9-A: install the packages on clean systems, as a user would, and start the browser (sandbox on, not root).
  # The .deb didn't open on a Debian desktop; ubuntu-22.04 (above) already had everything it needed.
  install-test:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:24.04', 'fedora:42']
    container: ${{ matrix.image }}
    name: install on ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: PacitumBrowser-Linux-main }
      - name: Install the package
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./PacitumBrowser-*.deb xvfb
          else
            dnf install -y -q ./PacitumBrowser-*.rpm xorg-x11-server-Xvfb util-linux shadow-utils
          fi
          test -x /usr/bin/pacitum-browser && test -f /usr/share/applications/pacitum-browser.desktop
      - name: Start it as a normal user
        run: |
          useradd -m tester
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          sleep 2
          runuser -u tester -- env DISPLAY=:99 HOME=/home/tester timeout 120 /usr/bin/pacitum-browser --smoke-test || echo "exit code $?"
          dir="/home/tester/.local/share/Pacitum/Pacitum Browser"
          echo "--- launch.log"; cat "$dir/launch.log" || true
          echo "--- startup.log"; tail -n 30 "$dir/startup.log" || true
          grep -q "SMOKE OK" "$dir/startup.log"
          if grep -q "^retrying" "$dir/launch.log"; then echo "::warning::${{ matrix.image }}: the browser only started in safe mode"; fi
